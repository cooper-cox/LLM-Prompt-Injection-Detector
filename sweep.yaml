method: bayes

metric:
  name: eval_acc
  goal: maximize

parameters:
  lr:
    values:
      - 0.01
      - 0.005
      - 0.001
      - 0.0005
      - 0.0001
      - 0.00005
      - 0.00001
  
  batch:
    values: [8, 16, 32]

  epoch:
    values: [10, 30, 50]

  threshold:
    values: [0.3, 0.4, 0.5, 0.6, 0.7]

  seq_length:
    values: [32, 64, 128, 256]
